<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crucero Mediterráneo — Fátima & Martín</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#2B1B5E;
    --navy-deep:#1A0F3D;
    --paper:#FFFDF6;
    --paper-dim:#FFF3D6;
    --coral:#FF5D8F;
    --coral-dim:#E8407A;
    --aqua:#00C2A8;
    --ink:#2B2250;
    --gold:#FFC93C;
    --violet:#8E5CFF;
    --sky:#3FCBFF;
    --lime:#8BE05C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%; margin:0;}
  body{
    font-family:'Inter', sans-serif;
    background: linear-gradient(160deg, #FF5D8F 0%, #8E5CFF 35%, #3FCBFF 70%, #00C2A8 100%);
    background-attachment: fixed;
    color:var(--paper);
    overflow:hidden;
    position:relative;
  }
  /* Textured wave background */
  .waves{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.35;
  }
  .waves svg{position:absolute; bottom:0; width:100%; height:180px;}

  .app{
    position:relative; z-index:1;
    height:100vh; width:100vw;
    display:flex; flex-direction:column;
  }

  /* Top bar */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 22px 8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
    color: rgba(255,255,255,0.75);
    flex-shrink:0;
  }
  .topbar .brand{color:var(--gold); font-weight:700; text-shadow: 0 1px 6px rgba(0,0,0,0.25);}
  .topbar .counter{color: rgba(255,255,255,0.9);}

  /* Progress dots grouped by day */
  .progress{
    display:flex; gap:4px; padding: 0 22px 14px; flex-wrap:wrap; flex-shrink:0;
  }
  .progress .day-group{ display:flex; gap:3px; padding-right:8px; }
  .progress .dot{
    width:5px; height:5px; border-radius:50%;
    background: rgba(255,255,255,0.3);
    transition: background 0.3s, transform .3s;
  }
  .progress .dot.active{ background: var(--gold); transform: scale(1.8); box-shadow: 0 0 8px var(--gold);}
  .progress .dot.done{ background: var(--lime); }

  /* Slide area */
  .stage{
    flex:1; position:relative; overflow:hidden;
  }
  .slide{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 20px 26px 30px;
    opacity:0; transform: translateX(40px) scale(0.98);
    transition: opacity .45s ease, transform .45s ease;
    pointer-events:none;
  }
  .slide.active{
    opacity:1; transform: translateX(0) scale(1);
    pointer-events:auto;
  }
  .slide.prev{ transform: translateX(-40px) scale(0.98); }

  /* ===== COVER SLIDE (day divider) ===== */
  .cover{
    text-align:center;
    max-width: 560px;
    position:relative;
    width:100%;
    border-radius:24px;
    overflow:hidden;
  }
  .cover-bg{
    position:absolute; inset:0;
    background-size:cover; background-position:center;
    transform: scale(1.02);
  }
  .cover-scrim{
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(43,27,94,0.45) 0%, rgba(142,92,255,0.5) 45%, rgba(255,93,143,0.75) 100%);
  }
  .cover-content{
    position:relative; z-index:2;
    padding: 34px 26px 30px;
  }
  .cover-detail{
    display:inline-flex; align-items:center; gap:10px;
    background: rgba(251,245,233,0.1);
    border:1px solid rgba(251,245,233,0.25);
    border-radius:100px; padding:6px 14px 6px 6px;
    margin-bottom:22px;
  }
  .cover-detail img{
    width:34px; height:34px; border-radius:50%; object-fit:cover;
    border:1.5px solid rgba(251,245,233,0.5);
  }
  .cover-detail span{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:0.05em;
    color: rgba(251,245,233,0.8); text-transform:uppercase;
  }
  .stamp{
    width:132px; height:132px; border-radius:50%;
    border: 3px dashed var(--gold);
    background: rgba(255,255,255,0.12);
    box-shadow: 0 0 0 6px rgba(255,255,255,0.08), 0 8px 24px rgba(0,0,0,0.25);
    display:flex; align-items:center; justify-content:center;
    margin: 0 auto 22px;
    position:relative;
    transform: rotate(-8deg);
    animation: stampIn .6s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes stampIn{
    0%{ transform: rotate(-8deg) scale(0.4); opacity:0; }
    100%{ transform: rotate(-8deg) scale(1); opacity:1; }
  }
  .stamp .icon{ font-size:52px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.3)); }
  .cover .daylabel{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; letter-spacing:0.18em; text-transform:uppercase;
    color: var(--gold); margin-bottom:6px;
  }
  .cover h1{
    font-family:'Fraunces', serif; font-weight:700;
    font-size: clamp(30px, 8vw, 52px);
    line-height:1.05; margin: 0 0 8px;
  }
  .cover .country{
    font-size:15px; color: rgba(251,245,233,0.7); margin-bottom:26px;
  }
  .cover .flagline{ font-size:34px; margin-bottom:10px; }
  .cover .swipehint{
    margin-top: 30px; font-family:'IBM Plex Mono', monospace;
    font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase;
    color: rgba(251,245,233,0.4);
  }

  /* ===== CONTENT SLIDE ===== */
  .card{
    background: var(--paper);
    color: var(--ink);
    border-radius: 22px;
    width:100%; max-width: 560px;
    max-height: 88%;
    padding: 30px 28px 26px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.45);
    overflow-y:auto;
    position:relative;
  }
  .card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:8px;
    background: linear-gradient(90deg, var(--coral), var(--gold), var(--lime), var(--sky), var(--violet));
    border-radius: 22px 22px 0 0;
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:7px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    color: var(--coral-dim);
    background: linear-gradient(90deg, rgba(255,93,143,0.15), rgba(142,92,255,0.15));
    padding: 5px 11px; border-radius: 100px;
    margin-bottom: 16px;
  }
  .onscreen{
    font-family:'Fraunces', serif; font-weight:600; font-style:italic;
    font-size: clamp(21px, 5.4vw, 27px);
    line-height:1.22; margin: 0 0 16px; color: var(--violet);
  }
  .voice{
    font-size:15.5px; line-height:1.6; color:#4a453b;
    padding-top:14px; border-top:2px dashed rgba(142,92,255,0.25);
  }
  .voice .tag{
    font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.1em;
    text-transform:uppercase; color: var(--aqua); display:block; margin-bottom:6px;
  }
  .content{
    font-size:15.5px; line-height:1.65; color:#4a453b; margin:0;
    padding-top:14px; border-top:2px dashed rgba(142,92,255,0.25);
  }

  .words-table{ width:100%; border-collapse:collapse; margin-top:4px; }
  .words-table td{ padding:9px 4px; border-bottom:2px dotted rgba(255,93,143,0.2); font-size:15px;}
  .words-table td:first-child{ color:#8a8474; font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; width:34%;}
  .words-table td:last-child{ font-family:'Fraunces', serif; font-style:italic; font-weight:600; color:var(--coral-dim);}

  .challenge-card{ border-left: 4px solid var(--lime); padding-left:14px; margin-top:2px; background: linear-gradient(90deg, rgba(139,224,92,0.12), transparent); border-radius: 0 12px 12px 0;}
  .vs{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.1em; color:var(--coral-dim); text-transform:uppercase; margin-bottom:8px; display:block;}

  /* Nav arrows */
  .navzone{
    position:fixed; top:0; bottom:0; width:26%; z-index:5;
  }
  .navzone.left{ left:0; }
  .navzone.right{ right:0; }

  .arrow{
    position:fixed; top:50%; transform: translateY(-50%);
    width:38px; height:38px; border-radius:50%;
    background: rgba(251,245,233,0.08);
    border:1px solid rgba(251,245,233,0.18);
    display:flex; align-items:center; justify-content:center;
    color: var(--paper); font-size:16px; cursor:pointer; z-index:6;
    transition: background .2s;
    user-select:none;
  }
  .arrow:hover{ background: rgba(251,245,233,0.18); }
  .arrow.left{ left:10px; }
  .arrow.right{ right:10px; }
  @media (max-width:640px){ .arrow{ display:none; } }

  .endslide{ text-align:center; max-width:520px; }
  .endslide h1{ font-family:'Fraunces', serif; font-size: clamp(28px,7vw,44px); margin-bottom:14px;}
  .endslide p{ font-size:16px; line-height:1.6; color: rgba(251,245,233,0.75); }
  .endslide .bigicon{ font-size:60px; margin-bottom:18px; }
  .endslide .diarybtn-big{ margin-top:22px; }

  /* ===== DIARIO DE VIAJE ===== */
  .topbar-actions{ display:flex; align-items:center; gap:10px; }
  .diarybtn{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase;
    background: rgba(255,201,60,0.25); color: var(--gold);
    border:1.5px solid var(--gold); border-radius:100px;
    padding:6px 12px; cursor:pointer; display:flex; align-items:center; gap:5px;
    font-weight:700;
  }
  .diarybtn:hover{ background: rgba(255,201,60,0.4); }

  .fab{
    position:fixed; bottom:22px; right:22px; z-index:8;
    background: linear-gradient(135deg, var(--coral), var(--violet));
    color:#fff;
    border:none; border-radius:100px;
    padding:12px 18px; font-family:'IBM Plex Mono', monospace;
    font-size:12px; letter-spacing:0.06em; text-transform:uppercase; font-weight:700;
    box-shadow: 0 8px 20px rgba(142,92,255,0.5);
    cursor:pointer; display:flex; align-items:center; gap:7px;
  }
  .fab:hover{ filter: brightness(1.1); }

  .overlay{
    position:fixed; inset:0; z-index:50;
    background: rgba(8,21,33,0.85);
    backdrop-filter: blur(4px);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    opacity:0; pointer-events:none;
    transition: opacity .25s ease;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .modal{
    background: var(--paper); color: var(--ink);
    border-radius:20px; width:100%; max-width:480px;
    max-height:86vh; overflow-y:auto;
    padding:26px 24px; position:relative;
  }
  .modal h2{ font-family:'Fraunces', serif; font-size:24px; margin:0 0 4px; }
  .modal .sub{ font-size:13px; color:#7a7466; margin-bottom:18px; }
  .modal .close{
    position:absolute; top:16px; right:16px; background:none; border:none;
    font-size:20px; color:#9a9484; cursor:pointer; line-height:1;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block; font-family:'IBM Plex Mono', monospace; font-size:10.5px;
    letter-spacing:0.08em; text-transform:uppercase; color:#8a8474; margin-bottom:6px;
  }
  .field select, .field input, .field textarea{
    width:100%; font-family:'Inter', sans-serif; font-size:15px;
    padding:10px 12px; border-radius:10px; border:1.5px solid #E2D8C2;
    background:#fff; color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:60px; }
  .stars{ display:flex; gap:6px; font-size:26px; }
  .stars span{ cursor:pointer; opacity:0.25; transition:opacity .15s; color:var(--gold);}
  .stars span.active{ opacity:1; }

  .savebtn{
    width:100%; background: linear-gradient(90deg, var(--coral), var(--violet)); color:#fff; border:none;
    border-radius:12px; padding:13px; font-size:15px; font-weight:700;
    cursor:pointer; margin-top:6px;
  }
  .savebtn:hover{ filter: brightness(1.08); }

  .diary-entry{
    border-bottom:1px solid rgba(30,27,21,0.08); padding: 14px 0;
  }
  .diary-entry:last-child{ border-bottom:none; }
  .diary-entry .de-top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .diary-entry .de-place{ font-family:'Fraunces', serif; font-weight:600; font-size:17px; }
  .diary-entry .de-day{ font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--aqua); text-transform:uppercase; white-space:nowrap; }
  .diary-entry .de-stars{ color:var(--gold); font-size:13px; margin:3px 0; }
  .diary-entry .de-note{ font-size:14px; color:#4a453b; line-height:1.5; }
  .diary-entry .de-del{
    font-family:'IBM Plex Mono', monospace; font-size:10px; color:#b0503a;
    background:none; border:none; cursor:pointer; margin-top:6px; text-transform:uppercase; letter-spacing:.06em; padding:0;
  }
  .diary-empty{ text-align:center; padding:30px 10px; color:#9a9484; font-size:14px; }
  .diary-actions{ display:flex; gap:8px; margin-top:16px; }
  .diary-actions button{
    flex:1; font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    padding:10px; border-radius:10px; border:1.5px solid #E2D8C2; background:#fff; color:var(--ink); cursor:pointer;
  }
  .toast{
    position:fixed; bottom:90px; left:50%; transform: translateX(-50%) translateY(10px);
    background: var(--ink); color:var(--paper); font-size:13px;
    padding:10px 18px; border-radius:100px; z-index:60;
    opacity:0; transition: opacity .25s, transform .25s; pointer-events:none;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="waves">
  <svg viewBox="0 0 1440 200" preserveAspectRatio="none"><path fill="#FFC93C" opacity="0.35" d="M0,100 C240,150 480,50 720,90 C960,130 1200,60 1440,100 L1440,200 L0,200 Z"/></svg>
</div>

<div class="app">
  <div class="topbar">
    <span class="brand">🌈 Pasaporte Mediterráneo</span>
    <div class="topbar-actions">
      <button class="diarybtn" id="openDiaryBtn">📖 Mi diario</button>
      <span class="counter" id="counter">1 / 1</span>
    </div>
  </div>
  <div class="progress" id="progress"></div>
  <div class="stage" id="stage"></div>
</div>


<div class="arrow left" id="arrowLeft">‹</div>
<div class="arrow right" id="arrowRight">›</div>
<div class="navzone left" id="zoneLeft"></div>
<div class="navzone right" id="zoneRight"></div>

<button class="fab" id="addEntryBtn">📝 Agregar recuerdo</button>

<!-- Modal: agregar recuerdo -->
<div class="overlay" id="entryOverlay">
  <div class="modal">
    <button class="close" id="closeEntryBtn">✕</button>
    <h2>Nuevo recuerdo</h2>
    <div class="sub" id="entryDayLabel">Puerto de hoy</div>

    <div class="field">
      <label>¿Qué visitaron o dónde comieron?</label>
      <input type="text" id="entryPlace" placeholder="Ej: Restaurante junto al puerto">
    </div>
    <div class="field">
      <label>¿Qué comieron / qué vieron?</label>
      <textarea id="entryDish" placeholder="Ej: Souvlaki de cordero y limonada casera"></textarea>
    </div>
    <div class="field">
      <label>Calificación</label>
      <div class="stars" id="entryStars">
        <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
      </div>
    </div>
    <div class="field">
      <label>Recuerdo / nota para recomendar</label>
      <textarea id="entryNote" placeholder="Ej: Pídelo sin cebolla, el mejor souvlaki del viaje"></textarea>
    </div>
    <button class="savebtn" id="saveEntryBtn">Guardar recuerdo</button>
  </div>
</div>

<!-- Modal: ver diario -->
<div class="overlay" id="diaryOverlay">
  <div class="modal">
    <button class="close" id="closeDiaryBtn">✕</button>
    <h2>Mi diario de viaje</h2>
    <div class="sub">Todo lo que fueron guardando, puerto por puerto</div>
    <div id="diaryList"></div>
    <div class="diary-actions">
      <button id="copyDiaryBtn">📋 Copiar como texto</button>
      <button id="clearDiaryBtn">🗑️ Borrar todo</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

// Build flat slide list: [cover, ...scenes] per day, plus final end slide
let slides = [];
DAYS.forEach((d, di)=>{
  slides.push({type:'cover', day:d, dayIndex:di});
  d.scenes.forEach(s=> slides.push({type:'scene', day:d, dayIndex:di, scene:s}));
});
slides.push({type:'end'});

let current = 0;

function renderStage(){
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  slides.forEach((s, i)=>{
    const el = document.createElement('div');
    el.className = 'slide';
    el.dataset.index = i;
    el.innerHTML = buildSlideHTML(s);
    stage.appendChild(el);
  });
  updateActive();
}

function buildSlideHTML(s){
  if(s.type==='cover'){
    const img = DAY_IMAGES[s.dayIndex];
    const bg = img ? `<div class="cover-bg" style="background-image:url('${img.hero}')"></div><div class="cover-scrim"></div>` : '';
    const detail = img && img.detail ? `
      <div class="cover-detail">
        <img src="${img.detail}" alt="${img.detailLabel||''}">
        <span>${img.detailLabel||''}</span>
      </div>` : '';
    return `
      <div class="cover">
        ${bg}
        <div class="cover-content">
          <div class="daylabel">${s.day.dateLabel}</div>
          <div class="stamp"><span class="icon">${s.day.icon}</span></div>
          <div class="flagline">${s.day.flag}</div>
          <h1>${s.day.place}</h1>
          <div class="country">${s.day.country}</div>
          ${detail}
          <div class="swipehint">Toca o desliza para empezar →</div>
        </div>
      </div>`;
  }
  if(s.type==='end'){
    return `
      <div class="endslide">
        <div class="bigicon">🧳</div>
        <h1>Fin del viaje</h1>
        <p>11 países, 3,600 años de historia y un montón de retos ganados. Ahora les toca decidir juntos: ¿cuál fue el mejor puerto del viaje?</p>
      </div>`;
  }
  // scene
  const sc = s.scene, day = s.day;
  let body = '';
  if(sc.words){
    const rows = (day.words||[]).map(w=>`<tr><td>${w[0]}</td><td>${w[1]}</td></tr>`).join('');
    body = `<table class="words-table">${rows}</table>`;
  } else if(sc.challenge){
    body = `<div class="challenge-card"><span class="vs">${day.flag} Reto de puerto</span>${sc.voice ? `<p class="content">${sc.voice}</p>` : ''}</div>`;
  } else if(sc.voice){
    body = `<p class="content">${sc.voice}</p>`;
  }
  return `
    <div class="card">
      <span class="eyebrow">${day.flag} ${sc.tag}</span>
      <p class="onscreen">${sc.onscreen}</p>
      ${body}
    </div>`;
}

function updateActive(){
  const stage = document.getElementById('stage');
  [...stage.children].forEach((el, i)=>{
    el.classList.remove('active','prev');
    if(i===current) el.classList.add('active');
    else if(i<current) el.classList.add('prev');
  });
  document.getElementById('counter').textContent = `${current+1} / ${slides.length}`;
  renderProgress();
}

function renderProgress(){
  const wrap = document.getElementById('progress');
  wrap.innerHTML = '';
  let idx = 0;
  DAYS.forEach((d)=>{
    const group = document.createElement('div');
    group.className = 'day-group';
    const count = 1 + d.scenes.length;
    for(let i=0;i<count;i++){
      const dot = document.createElement('div');
      dot.className = 'dot';
      if(idx === current) dot.classList.add('active');
      else if(idx < current) dot.classList.add('done');
      group.appendChild(dot);
      idx++;
    }
    wrap.appendChild(group);
  });
}

function goTo(i){
  if(i<0 || i>=slides.length) return;
  current = i;
  updateActive();
}
function next(){ goTo(current+1); }
function prev(){ goTo(current-1); }

document.getElementById('zoneLeft').addEventListener('click', prev);
document.getElementById('zoneRight').addEventListener('click', next);
document.getElementById('arrowLeft').addEventListener('click', prev);
document.getElementById('arrowRight').addEventListener('click', next);

document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') next();
  if(e.key==='ArrowLeft') prev();
});

// swipe support
let touchStartX = null;
document.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; });
document.addEventListener('touchend', e=>{
  if(touchStartX===null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(dx > 50) prev();
  else if(dx < -50) next();
  touchStartX = null;
});

renderStage();

/* ================= DIARIO DE VIAJE ================= */
const STORAGE_KEY = 'diario-crucero-entries';
let diaryEntries = [];
let selectedStars = 0;

function currentDayIndex(){
  const s = slides[current];
  if(s && typeof s.dayIndex === 'number') return s.dayIndex;
  return 0;
}

async function loadDiary(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    diaryEntries = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    diaryEntries = [];
  }
}

async function saveDiaryToStorage(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(diaryEntries), false);
  }catch(e){
    showToast('No se pudo guardar. Intenta de nuevo.');
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

/* --- Modal: agregar recuerdo --- */
const entryOverlay = document.getElementById('entryOverlay');
const addEntryBtn = document.getElementById('addEntryBtn');
const closeEntryBtn = document.getElementById('closeEntryBtn');

addEntryBtn.addEventListener('click', ()=>{
  const di = currentDayIndex();
  document.getElementById('entryDayLabel').textContent = `${DAYS[di].flag} ${DAYS[di].place} — ${DAYS[di].dateLabel}`;
  document.getElementById('entryPlace').value = '';
  document.getElementById('entryDish').value = '';
  document.getElementById('entryNote').value = '';
  selectedStars = 0;
  renderStars();
  entryOverlay.classList.add('open');
});
closeEntryBtn.addEventListener('click', ()=> entryOverlay.classList.remove('open'));
entryOverlay.addEventListener('click', (e)=>{ if(e.target===entryOverlay) entryOverlay.classList.remove('open'); });

function renderStars(){
  document.querySelectorAll('#entryStars span').forEach(s=>{
    s.classList.toggle('active', parseInt(s.dataset.v) <= selectedStars);
  });
}
document.querySelectorAll('#entryStars span').forEach(s=>{
  s.addEventListener('click', ()=>{ selectedStars = parseInt(s.dataset.v); renderStars(); });
});

document.getElementById('saveEntryBtn').addEventListener('click', async ()=>{
  const place = document.getElementById('entryPlace').value.trim();
  const dish = document.getElementById('entryDish').value.trim();
  const note = document.getElementById('entryNote').value.trim();
  if(!place && !dish){
    showToast('Cuéntanos al menos qué visitaron o comieron');
    return;
  }
  const di = currentDayIndex();
  const entry = {
    id: Date.now().toString(),
    dayIndex: di,
    place: DAYS[di].place,
    dateLabel: DAYS[di].dateLabel,
    flag: DAYS[di].flag,
    item: place,
    dish: dish,
    note: note,
    stars: selectedStars,
    ts: Date.now()
  };
  diaryEntries.push(entry);
  await saveDiaryToStorage();
  entryOverlay.classList.remove('open');
  showToast('¡Recuerdo guardado! 🎉');
});

/* --- Modal: ver diario --- */
const diaryOverlay = document.getElementById('diaryOverlay');
document.getElementById('openDiaryBtn').addEventListener('click', async ()=>{
  await loadDiary();
  renderDiaryList();
  diaryOverlay.classList.add('open');
});
document.getElementById('closeDiaryBtn').addEventListener('click', ()=> diaryOverlay.classList.remove('open'));
diaryOverlay.addEventListener('click', (e)=>{ if(e.target===diaryOverlay) diaryOverlay.classList.remove('open'); });

function renderDiaryList(){
  const list = document.getElementById('diaryList');
  if(!diaryEntries.length){
    list.innerHTML = `<div class="diary-empty">Todavía no hay recuerdos guardados.<br>Usa el botón "📝 Agregar recuerdo" en cada puerto.</div>`;
    return;
  }
  const sorted = [...diaryEntries].sort((a,b)=> a.dayIndex - b.dayIndex || a.ts - b.ts);
  list.innerHTML = sorted.map(e=>{
    const stars = '★'.repeat(e.stars) + '☆'.repeat(5-e.stars);
    const parts = [e.item, e.dish].filter(Boolean).join(' — ');
    return `
      <div class="diary-entry">
        <div class="de-top">
          <span class="de-place">${parts || '(sin título)'}</span>
          <span class="de-day">${e.flag} ${e.place}</span>
        </div>
        ${e.stars ? `<div class="de-stars">${stars}</div>` : ''}
        ${e.note ? `<div class="de-note">${e.note}</div>` : ''}
        <button class="de-del" data-id="${e.id}">Eliminar</button>
      </div>`;
  }).join('');
  list.querySelectorAll('.de-del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      diaryEntries = diaryEntries.filter(e=> e.id !== btn.dataset.id);
      await saveDiaryToStorage();
      renderDiaryList();
    });
  });
}

document.getElementById('copyDiaryBtn').addEventListener('click', ()=>{
  if(!diaryEntries.length){ showToast('Todavía no hay recuerdos guardados'); return; }
  const sorted = [...diaryEntries].sort((a,b)=> a.dayIndex - b.dayIndex || a.ts - b.ts);
  let text = "🧳 DIARIO DE VIAJE — Crucero Mediterráneo\nFátima & Martín\n\n";
  let lastDay = null;
  sorted.forEach(e=>{
    if(e.place !== lastDay){
      text += `\n${e.flag} ${e.place} (${e.dateLabel})\n`;
      lastDay = e.place;
    }
    const parts = [e.item, e.dish].filter(Boolean).join(' — ');
    text += `• ${parts || '(sin título)'}`;
    if(e.stars) text += ` (${'★'.repeat(e.stars)})`;
    text += '\n';
    if(e.note) text += `  "${e.note}"\n`;
  });
  navigator.clipboard.writeText(text).then(()=>{
    showToast('¡Copiado! Ya lo puedes pegar donde quieras');
  }).catch(()=>{
    showToast('No se pudo copiar automáticamente');
  });
});

document.getElementById('clearDiaryBtn').addEventListener('click', async ()=>{
  if(!diaryEntries.length){ showToast('El diario ya está vacío'); return; }
  if(confirm('¿Seguro que quieren borrar todos los recuerdos guardados? Esto no se puede deshacer.')){
    diaryEntries = [];
    await saveDiaryToStorage();
    renderDiaryList();
    showToast('Diario borrado');
  }
});

loadDiary();
</script>
</body>
</html>
